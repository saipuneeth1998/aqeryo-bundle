<style>
:root{--bg:#f4f6fb;--card:#fff;--line:#e5e8f1;--txt:#121834;--mut:#667090;--acc:#3b5bff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.03em}
.brand img{width:32px;height:32px;border-radius:50%}
.brand span{background:linear-gradient(90deg,#121834,#2f4bd8 60%,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.back{font-size:13px;font-weight:800;color:var(--acc);border:1px solid #d8def5;padding:9px 14px;border-radius:99px;background:#fff}
main{max-width:1080px;margin:auto;padding:26px 18px 60px}
h1{font-size:28px;font-weight:900;letter-spacing:-.035em}
.sub{color:var(--mut);margin-top:6px;font-size:14px}
.ok{margin-top:18px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:#ecfdf3;border:1px solid #b7ebcb;color:#14532d;font-size:14px;line-height:1.5}
.ok b{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:22px}
.p{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(30,40,100,.06);cursor:pointer;transition:.2s;text-align:left;font:inherit;color:inherit}
.p:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(30,40,100,.1)}
.p.on{outline:2px solid var(--acc)}
.p .im{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#0a0a1a}
.p .im img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;background:rgba(255,255,255,.92);color:#121834;padding:5px 9px;border-radius:8px}
.p h3{font-size:15px;font-weight:900;margin:12px 4px 4px;letter-spacing:-.01em}
.p small{display:block;color:var(--mut);font-size:12.5px;margin:0 4px 4px}
.dl{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(30,40,100,.06)}
.dl h2{font-size:20px;font-weight:900;letter-spacing:-.02em}
.kit{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;padding:12px 18px;border-radius:99px;color:#fff;background:linear-gradient(90deg,#22d3ee,#3b82f6 50%,#8b2cf5);box-shadow:0 8px 22px rgba(59,91,255,.25)}
.btn.alt{background:#fff;color:var(--acc);border:1px solid #d8def5;box-shadow:none}
.list{display:grid;gap:10px}
.it{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fafbff}
.it i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff;font-size:13px;background:linear-gradient(135deg,#22d3ee,#3b82f6 50%,#8b2cf5)}
.it b{font-size:14px}
.it a{font-size:12px;font-weight:800;color:#fff;background:var(--acc);padding:8px 13px;border-radius:99px;white-space:nowrap}
.sec{font-size:12px;font-weight:900;letter-spacing:.14em;color:#7c3aed;margin:18px 0 10px}
.tip{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip div{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;line-height:1.55;color:var(--mut)}
.tip b{color:var(--txt);display:block;margin-bottom:2px}
.empty{margin-top:24px;padding:28px;border-radius:20px;border:1px dashed #cdd3e6;background:#fff;text-align:center;color:var(--mut);line-height:1.6}
.empty b{color:var(--txt);font-size:16px;display:block;margin-bottom:6px}
@media(max-width:600px){h1{font-size:24px}.tip{grid-template-columns:1fr}.it{grid-template-columns:30px 1fr}.it a{grid-column:2;justify-self:start}}

.auth{max-width:440px;margin:22px auto 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(30,40,100,.06)}
.auth h2{font-size:22px;font-weight:900;letter-spacing:-.02em}.auth p{color:var(--mut);font-size:14px;line-height:1.55;margin:6px 0 16px}
.auth label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px}
.auth input{width:100%;padding:14px 16px;border:1px solid #d6dbea;border-radius:14px;font:inherit;font-size:16px;outline:none;background:#fafbff}
.auth input:focus{border-color:#3b5bff;box-shadow:0 0 0 4px rgba(59,91,255,.12)}
.auth input.code{letter-spacing:10px;font-size:24px;font-weight:900;text-align:center}
.auth .btn{width:100%;justify-content:center;margin-top:14px;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;padding:14px}
.auth .btn[disabled]{opacity:.6;cursor:wait}
.link{background:none;border:0;color:#3b5bff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;margin-top:12px}
.msg{min-height:20px;font-size:13px;font-weight:700;margin-top:10px;color:#dc2626}.msg.g{color:#15803d}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mut)}
.who b{color:var(--txt)}
.spin{margin:40px auto;width:34px;height:34px;border:3px solid #dfe3f2;border-top-color:#3b5bff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}

 V.innerHTML='<div class="auth"><h2>Sign in</h2><p>Enter the email you used when paying. We\'ll send you a 6-digit code.</p><label for="em">Email address</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="'+esc(ls(EK)||"")+'"><button class="btn" id="go">Send code</button><div class="msg" id="m">'+(msg||"")+'</div></div>';
